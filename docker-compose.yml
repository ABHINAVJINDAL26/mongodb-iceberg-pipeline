version: "3.9"

services:

  # Service 1: MongoDB with Replica Set + Auth (via custom init script)
  mongo1:
    image: mongo:6.0
    container_name: primary_mongo
    hostname: mongo1
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-setup.sh:/mongo-setup.sh:ro
    entrypoint: ["bash", "/mongo-setup.sh"]
    healthcheck:
      test: ["CMD", "mongosh", "--username", "admin", "--password", "password",
             "--authenticationDatabase", "admin", "--quiet",
             "--eval", "db.adminCommand('ping').ok", "localhost:27017/test"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - olake-net

  # Service 2: MinIO — Local S3 Storage (Iceberg files)
  minio:
    image: minio/minio:RELEASE.2025-04-03T14-56-28Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Web UI
    volumes:
      - ./data/minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - olake-net

  # Service 3: MinIO Bucket auto-create
  mc:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
        /usr/bin/mc mb myminio/olake-iceberg --ignore-existing;
        echo 'Bucket created!';
        exit 0;
      "
    networks:
      - olake-net
    restart: "no"

  # Service 4: PostgreSQL for Iceberg JDBC Catalog
  iceberg-postgres:
    image: postgres:15
    container_name: iceberg-postgres
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iceberg
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - olake-net

volumes:
  mongo-data:

networks:
  olake-net:
    driver: bridge
